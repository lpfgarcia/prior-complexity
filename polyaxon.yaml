kind: operation
queue: axia/default
name: prior-complexity
component:
  kind: component
  run:
    kind: job
    connections: [local-scratch, axia-artifacts]
    container:
      image: python:3.13
      workingDir: "{{ globals.artifacts_path }}/{{ globals.uuid }}/uploads"
      command: ["bash", "run.sh"]
      env:
        - name: OUT_DIR
          value: "{{ globals.run_outputs_path }}"
      resources:
        requests: {nvidia.com/gpu: 1, cpu: 8, memory: 32Gi}
        limits:   {nvidia.com/gpu: 1, cpu: 8, memory: 32Gi}